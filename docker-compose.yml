services:
  ollama:
    image: ollama/ollama:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - /mnt/LLM/gguf:/root/.ollama
    ports:
      - "11434:11434"

  xtts:
    image: ghcr.io/coqui-ai/xtts-streaming-server:latest-cuda121
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - COQUI_TOS_AGREED=1
    ports:
      - "8000:80"

  pipecat:
    build: .
    volumes:
      - .:/app
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - OPENAI_API_KEY=ollama
      - OPENAI_API_BASE=http://localhost:11434/v1
      - LLM_MODEL=tinyllama
    network_mode: host
    depends_on:
      - ollama
      - xtts
    command: python bot.py -t webrtc --host 0.0.0.0 --port 7860
