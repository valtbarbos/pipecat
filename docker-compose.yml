services:
  ollama:
    image: ollama/ollama:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - /mnt/LLM/gguf:/root/.ollama
    ports:
      - "11434:11434"

  xtts:
    image: ghcr.io/coqui-ai/xtts-streaming-server:latest-cuda121
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - COQUI_TOS_AGREED=1
    ports:
      - "8000:80"

  chatterbox:
    build:
      context: ./Chatterbox-TTS-Server
      dockerfile: Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    network_mode: host

  pipecat:
    build: .
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - .:/app
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-http://localhost:11434/v1}
      # ALTERNATIVE: - LLM_MODEL=tinyllama
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:14b}
      # LLM Temperature (0.0 - 2.0):
      # 0.2: Focused, deterministic (coding/math)
      # 0.7: Balanced (default)
      # 0.9: Creative, conversational
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.7}
      # Max Tokens: Controls response length.
      # 512 is good for concise conversational turns.
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-512}
      - TTS_VOICE=${TTS_VOICE:-Elena}
      - TTS_TEXT_AGGREGATOR=${TTS_TEXT_AGGREGATOR:-sentence}
      - SYSTEM_PROMPT_PATH=${SYSTEM_PROMPT_PATH:-instructions.md}
      - AVAILABLE_TTS_VOICES=Ana Florence,Andrew Chipper,Annmarie Nele,Asya Anara,Badr Odhiambo,Baldur Sanjin,Barbora MacLean,Brenda Stern,Camilla Holmström,Chandra MacFarland,Claribel Dervla,Craig Gutsy,Daisy Studious,Damien Black,Damjan Chapman,Dionisio Schuyler,Eugenio Mataracı,Ferran Simen,Filip Traverse,Gilberto Mathias,Gitta Nikolina,Gracie Wise,Henriette Usha,Ige Behringer,Ilkin Urbano,Kazuhiko Atallah,Kumar Dahl,Lidiya Szekeres,Lilya Stainthorpe,Ludvig Milivoj,Luis Moray,Maja Ruoho,Marcos Rudaski,Narelle Moon,Nova Hogarth,Rosemary Okafor,Royston Min,Sofia Hellen,Suad Qasim,Szofi Granger,Tammie Ema,Tammy Grit,Tanja Adelina,Torcull Diarmuid,Uta Obando,Viktor Eka,Viktor Menelaos,Vjollca Johnnie,Wulf Carlevaro,Xavier Hayasaka,Zacharie Aimilios,Zofija Kendrick
      - CHATTERBOX_VOICES=Abigail,Adrian,Alexander,Alice,Austin,Axel,Connor,Cora,Elena,Eli,Emily,Everett,Gabriel,Gianna,Henry,Ian,Jade,Jeremiah,Jordan,Julian,Layla,Leonardo,Michael,Miles,Olivia,Ryan,Taylor,Thomas
      - MEM0_API_KEY= # Add your Mem0 API key here, or configure local/qdrant in sota_bot.py
      # TTS Service Selection: 'xtts' (default: chatterbox)
      - TTS_SERVICE=${TTS_SERVICE:-chatterbox}
      - CHATTERBOX_URL=ws://localhost:8004/stream
      # Edge-Latency Bot Specifics
      - STT_MODE=${STT_MODE:-streaming}
      - STT_INTERIM_INTERVAL_MS=${STT_INTERIM_INTERVAL_MS:-200}
      - VAD_STOP_SECS=${VAD_STOP_SECS:-0.8}
      # UltraSpec Audio Config
      - AUDIO_FILTER=${AUDIO_FILTER:-none}
      - STT_LANGUAGE=${STT_LANGUAGE:-en}
      - ENABLE_STT_MUTE=${ENABLE_STT_MUTE:-false}

    network_mode: host
    depends_on:
      - ollama
      - xtts
    command: python bot-edge.py -t webrtc --host 0.0.0.0 --port 7860

  voice-ui:
    build:
      context: ./voice-ui-kit
      dockerfile: Dockerfile
    network_mode: host
    environment:
      - BOT_START_URL=http://localhost:7860/api/offer
      - UI_APP=${UI_APP:-03-tailwind}
