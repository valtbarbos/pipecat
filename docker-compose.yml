services:
  ollama:
    image: ollama/ollama:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - /mnt/LLM/gguf:/root/.ollama
    ports:
      - "11434:11434"

  xtts:
    image: ghcr.io/coqui-ai/xtts-streaming-server:latest-cuda121
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - COQUI_TOS_AGREED=1
    ports:
      - "8000:80"

  pipecat:
    build: .
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - .:/app
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - OPENAI_API_KEY=ollama
      - OPENAI_API_BASE=http://localhost:11434/v1
      # ALTERNATIVE: - LLM_MODEL=tinyllama
      - LLM_MODEL=gemma3:27b
      - TTS_VOICE=Daisy Studious
      - AVAILABLE_TTS_VOICES=Ana Florence,Andrew Chipper,Annmarie Nele,Asya Anara,Badr Odhiambo,Baldur Sanjin,Barbora MacLean,Brenda Stern,Camilla Holmström,Chandra MacFarland,Claribel Dervla,Craig Gutsy,Daisy Studious,Damien Black,Damjan Chapman,Dionisio Schuyler,Eugenio Mataracı,Ferran Simen,Filip Traverse,Gilberto Mathias,Gitta Nikolina,Gracie Wise,Henriette Usha,Ige Behringer,Ilkin Urbano,Kazuhiko Atallah,Kumar Dahl,Lidiya Szekeres,Lilya Stainthorpe,Ludvig Milivoj,Luis Moray,Maja Ruoho,Marcos Rudaski,Narelle Moon,Nova Hogarth,Rosemary Okafor,Royston Min,Sofia Hellen,Suad Qasim,Szofi Granger,Tammie Ema,Tammy Grit,Tanja Adelina,Torcull Diarmuid,Uta Obando,Viktor Eka,Viktor Menelaos,Vjollca Johnnie,Wulf Carlevaro,Xavier Hayasaka,Zacharie Aimilios,Zofija Kendrick
      - MEM0_API_KEY= # Add your Mem0 API key here, or configure local/qdrant in sota_bot.py
    network_mode: host
    depends_on:
      - ollama
      - xtts
    command: python bot.py -t webrtc --host 0.0.0.0 --port 7860
